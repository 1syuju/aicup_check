<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>活動報到 - AI CUP 2026</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="home-page">
    <div class="page-wrap">
        <div class="main-card">
            <a href="/" class="back-link">← 返回首頁</a>

            <span class="badge-pill">AI CUP 2026</span>
            <h1 class="page-title">活動報到</h1>
            <p class="page-subtitle">輸入姓名完成報到，系統將顯示您的座位資訊</p>

            <form id="checkinForm" class="checkin-form">
                <label for="name" class="form-label">參賽者姓名</label>
                <div class="input-row">
                    <input type="text" class="form-input" id="name" name="name"
                           placeholder="請輸入姓名" required autocomplete="off">
                    <button type="submit" class="btn-submit" id="submitBtn">報到</button>
                </div>
            </form>

            <hr class="form-divider" id="resultDivider" style="display: none;">

            <div id="resultCard" style="display: none;"></div>
            <div id="errorBox" style="display: none;"></div>
        </div>
    </div>

    <script>
        const checkinForm = document.getElementById('checkinForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultCard = document.getElementById('resultCard');
        const resultDivider = document.getElementById('resultDivider');
        const errorBox = document.getElementById('errorBox');

        checkinForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            if (!name) {
                showError('請輸入姓名');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '報到中...';
            hideError();
            hideResult();

            try {
                const response = await fetch('/api/checkin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });

                const data = await response.json();

                // #region agent log
                fetch('http://127.0.0.1:7769/ingest/dc4c56e1-c0c0-4e18-85f5-b109639f0a22',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'d610a5'},body:JSON.stringify({sessionId:'d610a5',runId:'pre-fix',hypothesisId:'A,D',location:'checkin.html:fetch',message:'checkin api response',data:{success:data.success,participantKeys:data.participant?Object.keys(data.participant):[],checkinTime:data.participant?.checkin_time??null},timestamp:Date.now()})}).catch(()=>{});
                // #endregion

                if (data.success) {
                    showResult(data.participant);
                } else {
                    showError(data.message);
                }
            } catch (error) {
                showError('網路錯誤，請稍後再試');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '報到';
            }
        });

        function showResult(participant) {
            const initial = participant.name ? participant.name.charAt(0) : '?';
            const org = participant.organization || '未填寫';
            const competition = participant.competition_name || '未填寫';
            const seat = participant.seat_number || '未分配';
            const time = participant.checkin_time || '--:--';

            resultCard.innerHTML = `
                <div class="result-card">
                    <div class="result-header">
                        <div class="avatar">${initial}</div>
                        <div class="result-info">
                            <p class="result-name">${participant.name}</p>
                            <p class="result-org">${org}</p>
                        </div>
                        <span class="status-badge">
                            <span class="status-dot"></span>
                            報到完成
                        </span>
                    </div>
                    <div class="seat-section">
                        <p class="seat-label">座位號碼</p>
                        <div class="seat-box">
                            <span class="seat-icon">🪑</span>
                            <span>${seat}</span>
                        </div>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">競賽項目</span>
                        <span class="detail-value">${competition}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">報到時間</span>
                        <span class="detail-value">${time}</span>
                    </div>
                </div>
            `;
            resultCard.style.display = 'block';
            resultDivider.style.display = 'block';
        }

        function hideResult() {
            resultCard.style.display = 'none';
            resultCard.innerHTML = '';
            resultDivider.style.display = 'none';
        }

        function showError(message) {
            errorBox.innerHTML = `<div class="error-box">${message}</div>`;
            errorBox.style.display = 'block';
        }

        function hideError() {
            errorBox.style.display = 'none';
            errorBox.innerHTML = '';
        }
    </script>
</body>
</html>
