<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>競賽報到系統 - AI CUP 2026</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <div class="page-wrap">
        <div class="main-card">
            <span class="badge-pill">AI CUP 2026</span>
            <h1 class="page-title">競賽報到系統</h1>
            <p class="page-subtitle">歡迎參加 AI CUP 2026</p>
            <p class="page-subtitle">請選擇報到方式</p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="flash-message">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="btn-stack">
                <a href="/checkin" class="btn-dark">現場報到</a>
                <a href="/qr_scanner" class="btn-outline">掃描 QR Code</a>
            </div>

            <hr class="footer-divider">

            {% if is_admin %}
            <div class="footer-actions">
                <a href="/admin" class="btn-outline">管理後台</a>
                <a href="/admin_logout" class="footer-link">登出管理員</a>
            </div>
            {% else %}
            <a href="/admin_login" class="footer-link">管理員登入</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
