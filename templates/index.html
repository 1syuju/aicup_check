<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI CUP 2025 報到系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #2c345a 0%, #020307 100%);
            min-height: 100vh;
            font-family: 'Microsoft JhengHei', sans-serif;
            position: relative;
            overflow-x: hidden;
        }
        
        .header-image {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }
        
        .header-image {
            width: 100%;
        }
        
        .header-image img {
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .main-container {
            padding: 20px 15px;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .title-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .title-section h1 {
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            color: white;
            margin-bottom: 10px;
        }
        
        .title-section .icon-large {
            font-size: 3rem;
            color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            margin-bottom: 15px;
        }
        
        .card {
            border: none;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }
        
        .card-header {
            background: linear-gradient(135deg, #a2a6b9, #7685c9);
            color: white;
            text-align: center;
            padding: 30px 20px;
            border: none;
        }
        
        .card-header i {
            font-size: 1.5rem;
            margin-right: 10px;
            display: inline-block;
        }
        
        .card-header h3 {
            font-size: 1.5rem;
            margin: 0;
            font-weight: bold;
            display: inline-block;
        }
        
        .card-body {
            padding: 30px 20px;
        }
        
        .card-text {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 25px;
        }
        
        .btn-checkin {
            width: 100%;
            border-radius: 50px;
            padding: 18px 30px;
            font-size: 1.3rem;
            font-weight: 600;
            background: linear-gradient(135deg, #7685c9, #9d88b2);
            border: none;
            color: white;
            box-shadow: 0 5px 15px rgba(118, 133, 201, 0.4);
            transition: all 0.3s ease;
        }
        
        .btn-checkin:active {
            transform: scale(0.98);
        }
        
        .admin-links {
            margin-top: 25px;
            text-align: center;
        }
        
        .admin-links .btn {
            margin: 5px;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .admin-lock {
            color: white;
            opacity: 0.5;
            font-size: 0.9rem;
            text-decoration: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        @media (max-width: 576px) {
            .title-section h1 {
                font-size: 1.5rem;
            }
            
            .card-header i {
                font-size: 3rem;
            }
            
            .card-header h3 {
                font-size: 1.3rem;
            }
            
            .btn-checkin {
                font-size: 1.2rem;
                padding: 16px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container main-container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="title-section">
                    <h1>AI CUP 2025 報到系統</h1>
                </div>
                <div class="header-image">
                    <img src="{{ url_for('static', filename='images/mainstyle.jpg') }}" alt="AI CUP 2025">
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-user-check"></i>
                        <h3>參加者報到</h3>
                    </div>
                    <div class="card-body">
                        <a href="/checkin" class="btn btn-checkin">
                            <i class="fas fa-sign-in-alt me-2"></i>開始報到
                        </a>
                    </div>
                </div>
                
                {% if is_admin %}
                <div class="admin-links">
                    <a href="/admin" class="btn">
                        <i class="fas fa-user-shield me-1"></i>管理後台
                    </a>
                    <a href="/admin_logout" class="btn">
                        <i class="fas fa-sign-out-alt me-1"></i>登出
                    </a>
                </div>
                {% else %}
                <p class="mt-4 mb-0 text-center">
                    <a href="/admin_login" class="admin-lock">
                        <i class="fas fa-user-lock me-1"></i>
                    </a>
                </p>
                {% endif %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
