<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匯入參加者名單 - AI CUP 2026</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <div class="page-wrap">
        <div class="main-card">
            <a href="/admin" class="back-link">← 返回後台</a>

            <span class="badge-pill">AI CUP 2026</span>
            <h1 class="page-title">匯入參加者名單</h1>
            <p class="page-subtitle">上傳 Excel 檔案以匯入參加者資料</p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="flash-message">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" enctype="multipart/form-data" class="checkin-form">
                <label for="file" class="form-label">Excel 檔案 (.xlsx)</label>
                <input type="file" class="form-input" id="file" name="file" accept=".xlsx" required style="width:100%;">

                <div class="btn-stack" style="margin-top:20px;">
                    <button type="submit" class="btn-dark">開始匯入</button>
                </div>
            </form>

            <div class="result-card" style="margin-top:24px;">
                <p class="page-subtitle" style="margin:0 0 8px;">必要欄位：隊員姓名</p>
                <p class="page-subtitle" style="margin:0;">建議欄位：隊伍名稱、競賽、座號、貴隊伍聯絡代表人手機號碼</p>
            </div>
        </div>
    </div>
</body>
</html>
