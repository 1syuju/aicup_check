<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理員登入 - AI CUP 2025</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #a2a6b9, #7685c9);
            min-height: 100vh;
            font-family: 'Microsoft JhengHei', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px 25px;
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header i {
            font-size: 3.5rem;
            color: #7685c9;
            margin-bottom: 15px;
        }
        
        .login-header h2 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.6rem;
            font-weight: bold;
        }
        
        .login-header p {
            color: #666;
            margin: 0;
            font-size: 1rem;
        }
        
        .form-label {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .form-control {
            border-radius: 15px;
            border: 2px solid #e9ecef;
            padding: 16px 20px;
            font-size: 1.1rem;
        }
        
        .form-control:focus {
            border-color: #7685c9;
            box-shadow: 0 0 0 0.2rem rgba(118, 133, 201, 0.25);
        }
        
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #a2a6b9, #7685c9);
            border: none;
            border-radius: 50px;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(118, 133, 201, 0.4);
        }
        
        .btn-login:active {
            transform: scale(0.98);
        }
        
        .btn-back {
            width: 100%;
            background: #6c757d;
            border: none;
            border-radius: 50px;
            padding: 14px;
            color: white;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            margin-top: 12px;
            font-size: 1rem;
        }
        
        .btn-back:active {
            background: #5a6268;
            transform: scale(0.98);
        }
        
        .alert {
            border-radius: 15px;
            border: none;
            padding: 15px;
            font-size: 0.95rem;
        }
        
        @media (max-width: 576px) {
            .login-container {
                padding: 35px 20px;
            }
            
            .login-header h2 {
                font-size: 1.4rem;
            }
            
            .login-header i {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-user-shield"></i>
            <h2>管理員登入</h2>
            <p>AI CUP 2025 報到系統</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST">
            <div class="mb-3">
                <label for="password" class="form-label">
                    <i class="fas fa-lock me-2"></i>管理員密碼
                </label>
                <input type="password" class="form-control" id="password" name="password" 
                       placeholder="請輸入密碼" required autocomplete="off">
            </div>
            
            <button type="submit" class="btn btn-login">
                <i class="fas fa-sign-in-alt me-2"></i>登入
            </button>
        </form>
        
        <a href="{{ url_for('index') }}" class="btn-back">
            <i class="fas fa-arrow-left me-2"></i>返回首頁
        </a>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
