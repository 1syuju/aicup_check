<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理員登入 - AI CUP 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="home-page">
    <div class="page-wrap">
        <div class="main-card">
            <a href="/" class="back-link">← 返回首頁</a>

            <span class="badge-pill">AI CUP 2026</span>
            <h1 class="page-title">管理員登入</h1>
            <p class="page-subtitle">請輸入管理員密碼以進入後台</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-message{% if category == 'error' %} flash-message-error{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" class="checkin-form">
                <label for="password" class="form-label">管理員密碼</label>
                <input type="password" class="form-input" id="password" name="password"
                       placeholder="請輸入密碼" required autocomplete="off" style="width:100%;">

                <div class="btn-stack" style="margin-top:20px;">
                    <button type="submit" class="btn-dark">登入</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
