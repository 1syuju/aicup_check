<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>掃描 QR Code - AI CUP 2026</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <div class="page-wrap">
        <div class="main-card scanner-card">
            <a href="/" class="back-link">← 返回首頁</a>

            <span class="badge-pill">AI CUP 2026</span>
            <h1 class="page-title">掃描 QR Code</h1>
            <p class="page-subtitle">對準參加者 QR Code，掃描後自動完成報到</p>

            <div id="scannerSection" class="scanner-section">
                <div id="qr-reader" class="qr-reader"></div>
                <p class="scanner-hint">請將 QR Code 置於框內</p>
                <label class="btn-outline camera-upload-btn" for="qrImageInput">
                    使用手機相機拍攝 QR Code
                </label>
                <input type="file" id="qrImageInput" accept="image/*" capture="environment" hidden>
                <div id="qr-image-reader" hidden></div>
            </div>

            <div id="processingBox" class="flash-message" style="display:none; margin-top:16px;">
                正在處理報到...
            </div>

            <div id="resultCard" style="display:none; margin-top:16px;"></div>
            <div id="errorBox" style="display:none; margin-top:16px;"></div>

            <div id="actionBox" class="btn-stack" style="display:none; margin-top:16px;">
                <button type="button" class="btn-dark" id="scanAgainBtn">繼續掃描</button>
                <a href="/checkin" class="btn-outline">改用手動報到</a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        const scannerSection = document.getElementById('scannerSection');
        const processingBox = document.getElementById('processingBox');
        const resultCard = document.getElementById('resultCard');
        const errorBox = document.getElementById('errorBox');
        const actionBox = document.getElementById('actionBox');
        const scanAgainBtn = document.getElementById('scanAgainBtn');
        const qrImageInput = document.getElementById('qrImageInput');

        let html5QrCode = null;
        let processing = false;
        let lastScanned = '';

        function parseParticipantId(text) {
            const value = (text || '').trim();
            const urlMatch = value.match(/mobile_checkin\/(\d+)/i);
            if (urlMatch) return parseInt(urlMatch[1], 10);

            const pathMatch = value.match(/\/qr\/(\d+)/i);
            if (pathMatch) return parseInt(pathMatch[1], 10);

            if (/^\d+$/.test(value)) return parseInt(value, 10);
            return null;
        }

        function hideError() {
            errorBox.style.display = 'none';
            errorBox.innerHTML = '';
        }

        function showError(message) {
            errorBox.innerHTML = `<div class="error-box">${message}</div>`;
            errorBox.style.display = 'block';
        }

        function showResult(participant) {
            const initial = participant.name ? participant.name.charAt(0) : '?';
            const org = participant.organization || '未填寫';
            const competition = participant.competition_name || '未填寫';
            const seat = participant.seat_number || '未分配';
            const time = participant.checkin_time || '--:--';

            resultCard.innerHTML = `
                <div class="result-card">
                    <div class="result-header">
                        <div class="avatar">${initial}</div>
                        <div class="result-info">
                            <p class="result-name">${participant.name}</p>
                            <p class="result-org">${org}</p>
                        </div>
                        <span class="status-badge">
                            <span class="status-dot"></span>
                            報到完成
                        </span>
                    </div>
                    <div class="seat-section">
                        <p class="seat-label">座位號碼</p>
                        <div class="seat-box">
                            <span class="seat-icon">🪑</span>
                            <span>${seat}</span>
                        </div>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">競賽項目</span>
                        <span class="detail-value">${competition}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">報到時間</span>
                        <span class="detail-value">${time}</span>
                    </div>
                </div>
            `;
            resultCard.style.display = 'block';
        }

        async function handleScan(decodedText) {
            if (processing) return;

            const participantId = parseParticipantId(decodedText);
            if (!participantId) {
                showError('無法辨識的 QR Code，請確認是否為參加者報到 QR');
                return;
            }

            if (decodedText === lastScanned) return;
            lastScanned = decodedText;
            processing = true;
            hideError();
            resultCard.style.display = 'none';
            processingBox.style.display = 'block';

            if (html5QrCode) {
                try { await html5QrCode.pause(true); } catch (e) {}
            }

            try {
                const response = await fetch(`/api/mobile_checkin/${participantId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ method: 'qr' })
                });
                const data = await response.json();

                processingBox.style.display = 'none';

                if (data.success) {
                    scannerSection.style.display = 'none';
                    showResult(data.participant);
                    actionBox.style.display = 'flex';
                } else {
                    showError(data.message || '報到失敗');
                    actionBox.style.display = 'flex';
                }
            } catch (error) {
                processingBox.style.display = 'none';
                showError('網路錯誤，請稍後再試');
                actionBox.style.display = 'flex';
            } finally {
                processing = false;
            }
        }

        async function scanImage(file) {
            if (!file || processing) return;

            if (typeof Html5Qrcode === 'undefined') {
                showError('掃描器載入失敗，請確認網路連線後重新整理頁面');
                return;
            }

            processing = true;
            hideError();
            processingBox.textContent = '正在辨識照片...';
            processingBox.style.display = 'block';

            try {
                const imageScanner = new Html5Qrcode('qr-image-reader');
                const decodedText = await imageScanner.scanFile(file, true);
                await imageScanner.clear();
                processing = false;
                await handleScan(decodedText);
            } catch (error) {
                showError('照片中找不到 QR Code，請重新拍攝並讓 QR Code 完整入鏡');
            } finally {
                processingBox.style.display = 'none';
                processingBox.textContent = '正在處理報到...';
                processing = false;
                qrImageInput.value = '';
            }
        }

        async function startScanner() {
            hideError();
            resultCard.style.display = 'none';
            actionBox.style.display = 'none';
            scannerSection.style.display = 'block';
            processingBox.style.display = 'none';
            processingBox.textContent = '正在處理報到...';
            lastScanned = '';
            processing = false;

            if (typeof Html5Qrcode === 'undefined') {
                scannerSection.style.display = 'none';
                showError('掃描器載入失敗，請確認網路連線後重新整理頁面');
                actionBox.style.display = 'flex';
                return;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                document.getElementById('qr-reader').style.display = 'none';
                showError('iPhone 需要安全連線才能使用相機，請用 https://電腦IP:5000 開啟（手機上的 localhost 不是電腦）');
                actionBox.style.display = 'flex';
                return;
            }

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode('qr-reader');
            } else {
                try { await html5QrCode.stop(); } catch (e) {}
                try { await html5QrCode.clear(); } catch (e) {}
            }

            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            try {
                await html5QrCode.start(
                    { facingMode: 'environment' },
                    config,
                    handleScan,
                    () => {}
                );
            } catch (err) {
                scannerSection.style.display = 'none';
                showError('無法啟動相機，請允許 Safari 相機權限，並確認使用 https://電腦IP:5000 開啟');
                actionBox.style.display = 'flex';
            }
        }

        scanAgainBtn.addEventListener('click', startScanner);
        qrImageInput.addEventListener('change', (event) => scanImage(event.target.files[0]));

        document.addEventListener('DOMContentLoaded', startScanner);
    </script>
</body>
</html>
